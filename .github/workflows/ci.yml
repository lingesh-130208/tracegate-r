name: TraceGate-R CI

on:
  push:
    branches:
      - tracegate-r-runtime-fixes
      - 'tracegate/**'
  pull_request:
    branches:
      - main
      - tracegate-r-runtime-fixes
      - 'tracegate/**'

permissions:
  contents: read

concurrency:
  group: tracegate-ci
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-training.txt
      - name: Install backend and training dependencies
        run: python -m pip install -r requirements-training.txt pytest
      - name: Backend test suite
        run: python -m pytest -q tests
      - name: Feature provenance check
        run: python scripts/build_feature_provenance.py --check
      - name: Python syntax check
        run: python -m compileall -q backend scripts tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
