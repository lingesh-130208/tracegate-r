name: TraceGate-R QUT-DV25 model training

on:
  push:
    branches:
      - 'tracegate/train-model-artifacts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-training.txt
      - name: Install training dependencies
        run: python -m pip install -r requirements-training.txt pytest
      - name: Diagnose public Dataverse range access
        run: |
          python - <<'PY'
          import urllib.error, urllib.request
          urls = [
              "https://dataverse.harvard.edu/api/access/datafile/11542393",
              "https://dataverse.harvard.edu/api/access/datafile/11542393?gbrecs=true",
              "https://dataverse.harvard.edu/api/access/datafile/:persistentId?persistentId=doi%3A10.7910%2FDVN%2FLBMXJY",
          ]
          agents = [
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
              "TraceGate-R-training/1.0",
          ]
          for url in urls:
              for agent in agents:
                  request = urllib.request.Request(url, headers={
                      "User-Agent": agent,
                      "Accept": "application/octet-stream,*/*;q=0.8",
                      "Range": "bytes=0-255",
                      "Referer": "https://dataverse.harvard.edu/",
                  })
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          snippet = response.read(256)
                          print({
                              "url": url,
                              "agent": agent[:24],
                              "status": response.status,
                              "final_url": response.geturl()[:180],
                              "content_type": response.headers.get("Content-Type"),
                              "content_length": response.headers.get("Content-Length"),
                              "content_range": response.headers.get("Content-Range"),
                              "sample": snippet[:80].decode("utf-8", errors="replace") if response.status not in (200,206) else "<binary response>",
                          })
                  except urllib.error.HTTPError as error:
                      body = error.read(512).decode("utf-8", errors="replace")
                      print({
                          "url": url, "agent": agent[:24], "status": error.code,
                          "final_url": error.geturl()[:180],
                          "content_type": error.headers.get("Content-Type"),
                          "body": body[:300],
                      })
                  except Exception as error:
                      print({"url": url, "agent": agent[:24], "error": type(error).__name__ + ": " + str(error)[:200]})
          PY
      - name: Train and validate real models from the checksum-verified dataset
        run: |
          python scripts/train_qut_models.py \
            --download \
            --output-dir "$GITHUB_WORKSPACE/tracegate-artifacts"
      - name: Confirm all artifacts and provenance are present
        run: |
          python - "$GITHUB_WORKSPACE/tracegate-artifacts" <<'PY'
          import json
          import sys
          from pathlib import Path
          d = Path(sys.argv[1])
          required = [
              "logistic_regression.joblib",
              "random_forest.joblib",
              "feature_names.json",
              "metrics.json",
              "training_manifest.json",
          ]
          missing = [name for name in required if not (d / name).is_file()]
          if missing:
              raise SystemExit(f"Missing artifacts: {missing}")
          names = json.loads((d / "feature_names.json").read_text())
          manifest = json.loads((d / "training_manifest.json").read_text())
          metrics = json.loads((d / "metrics.json").read_text())
          assert len(names) == 48 and len(set(names)) == 48
          assert manifest["models_smoke_tested_after_serialization"] is True
          assert manifest["evaluation"]["package_group_overlap"] == 0
          assert set(metrics["models"]) == {
              "logistic_regression", "random_forest", "ensemble_mean_probability"
          }
          print(json.dumps({
              "artifact_names": required,
              "feature_count": len(names),
              "dataset": manifest["dataset"],
              "evaluation": manifest["evaluation"],
              "model_metrics": metrics["models"],
              "artifact_sha256": manifest["artifact_sha256"],
              "training_data_is_live_telemetry": manifest["training_data_is_live_telemetry"],
          }, indent=2))
          PY
      - name: Upload model artifacts and evaluation manifest
        uses: actions/upload-artifact@v4
        with:
          name: tracegate-qut-dv25-models
          path: tracegate-artifacts/
          if-no-files-found: error
          retention-days: 7
